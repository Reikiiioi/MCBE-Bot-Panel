<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BotMCBE — Python Control Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card: #111726;
      --card-hover: #172033;
      --border: #1e293b;
      --cyan: #38bdf8;
      --purple: #a855f7;
      --green: #10b981;
      --red: #ef4444;
      --yellow: #f59e0b;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      padding: 24px;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }
    .logo { display: flex; align-items: center; gap: 12px; font-size: 1.5rem; font-weight: 800; }
    .logo-badge {
      background: linear-gradient(135deg, var(--cyan), var(--purple));
      color: #fff;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
    }
    .status-pill {
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.85rem;
      background: rgba(100, 116, 139, 0.2);
      color: var(--muted);
      border: 1px solid var(--border);
    }
    .status-pill.running { background: rgba(16, 185, 129, 0.15); color: var(--green); border-color: rgba(16, 185, 129, 0.3); }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }
    .metric-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      text-align: center;
    }
    .metric-val { font-size: 2rem; font-weight: 800; color: var(--cyan); margin-top: 4px; }
    .metric-lbl { color: var(--muted); font-size: 0.85rem; }

    .main-grid {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 24px;
    }
    @media (max-width: 900px) { .main-grid { grid-template-columns: 1fr; } }

    .panel-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
    }
    .panel-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 20px; color: var(--text); }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; }
    .form-control {
      width: 100%;
      background: #0b0f19;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
    }
    .form-control:focus { border-color: var(--cyan); }
    textarea.form-control { resize: vertical; min-height: 80px; font-family: 'Fira Code', monospace; }

    .btn-row { display: flex; gap: 12px; margin-top: 24px; }
    .btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-start { background: linear-gradient(135deg, var(--green), #059669); color: #000; }
    .btn-start:hover { box-shadow: 0 0 15px rgba(16, 185, 129, 0.4); }
    .btn-stop { background: linear-gradient(135deg, var(--red), #dc2626); color: #fff; }
    .btn-stop:hover { box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); }

    .terminal-box {
      background: #0b0f19;
      border: 1px solid var(--border);
      border-radius: 10px;
      height: 480px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .terminal-header {
      background: #0f1422;
      padding: 10px 16px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
    }
    .terminal-body {
      flex: 1;
      padding: 16px;
      font-family: 'Fira Code', monospace;
      font-size: 0.85rem;
      overflow-y: auto;
      line-height: 1.6;
    }
    .log-line { margin-bottom: 4px; display: flex; gap: 10px; }
    .log-time { color: #64748b; }
    .log-type-info { color: var(--cyan); }
    .log-type-success { color: var(--green); }
    .log-type-warning { color: var(--yellow); }
    .log-type-error { color: var(--red); }
    .log-type-chat { color: var(--purple); }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">
        <span>BotMCBE</span>
        <span class="logo-badge">Python Edition</span>
      </div>
      <div id="status-pill" class="status-pill">Остановлен</div>
    </header>

    <div class="metrics-grid">
      <div class="metric-card">
        <div class="metric-lbl">Онлайн Боты</div>
        <div id="m-online" class="metric-val" style="color:var(--green)">0</div>
      </div>
      <div class="metric-card">
        <div class="metric-lbl">Отключено / Кикнуто</div>
        <div id="m-kicked" class="metric-val" style="color:var(--yellow)">0</div>
      </div>
      <div class="metric-card">
        <div class="metric-lbl">Отправлено Сообщений</div>
        <div id="m-msgs" class="metric-val" style="color:var(--purple)">0</div>
      </div>
      <div class="metric-card">
        <div class="metric-lbl">Ошибки</div>
        <div id="m-errors" class="metric-val" style="color:var(--red)">0</div>
      </div>
      <div class="metric-card">
        <div class="metric-lbl">Время работы (сек)</div>
        <div id="m-uptime" class="metric-val" style="color:var(--cyan)">0</div>
      </div>
    </div>

    <div class="main-grid">
      <div class="panel-card">
        <div class="panel-title">Параметры Подключения</div>
        
        <div class="form-group">
          <label>Сервер Host / IP</label>
          <input type="text" id="host" class="form-control" value="127.0.0.1">
        </div>
        <div class="form-group">
          <label>Порт</label>
          <input type="number" id="port" class="form-control" value="19132">
        </div>
        <div class="form-group">
          <label>Версия Протокола</label>
          <input type="text" id="version" class="form-control" value="1.20.80">
        </div>
        <div class="form-group">
          <label>Базовый Никнейм</label>
          <input type="text" id="baseUsername" class="form-control" value="Bot">
        </div>
        <div class="form-group">
          <label>Количество Ботов</label>
          <input type="number" id="count" class="form-control" value="10">
        </div>
        <div class="form-group">
          <label>Задержка Спавна (сек)</label>
          <input type="number" step="0.1" id="delay" class="form-control" value="0.5">
        </div>
        <div class="form-group">
          <label>Сообщения Чанта (по 1 в строке)</label>
          <textarea id="messages" class="form-control">!привет всем!</textarea>
        </div>

        <div class="btn-row">
          <button class="btn btn-start" onclick="startSwarm()">ЗАПУСК</button>
          <button class="btn btn-stop" onclick="stopSwarm()">СТОП</button>
        </div>
      </div>

      <div class="terminal-box">
        <div class="terminal-header">
          <span>Лог Событий (Real-time)</span>
          <span style="cursor:pointer;" onclick="clearLogs()">Очистить</span>
        </div>
        <div id="terminal-body" class="terminal-body"></div>
      </div>
    </div>
  </div>

  <script>
    let ws;
    function connectWS() {
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${protocol}//${location.host}/ws`);
      ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        if (msg.stats) updateStats(msg.stats);
        if (msg.event === 'log' && msg.data) appendLog(msg.data);
        if (msg.event === 'init') {
          updateStats(msg.stats);
          if (msg.logs) msg.logs.forEach(appendLog);
        }
      };
      ws.onclose = () => setTimeout(connectWS, 2000);
    }
    connectWS();

    function updateStats(s) {
      document.getElementById('m-online').innerText = s.online || 0;
      document.getElementById('m-kicked').innerText = s.kicked || 0;
      document.getElementById('m-msgs').innerText = s.messagesSent || 0;
      document.getElementById('m-errors').innerText = s.errors || 0;
      document.getElementById('m-uptime').innerText = s.uptime || 0;

      const pill = document.getElementById('status-pill');
      if (s.status === 'running') {
        pill.innerText = 'Запущен (' + s.online + ' ботов)';
        pill.className = 'status-pill running';
      } else {
        pill.innerText = 'Остановлен';
        pill.className = 'status-pill';
      }
    }

    function appendLog(log) {
      const body = document.getElementById('terminal-body');
      const line = document.createElement('div');
      line.className = 'log-line';
      const typeClass = 'log-type-' + (log.type || 'info');
      line.innerHTML = `<span class="log-time">[${log.time || ''}]</span> <span class="${typeClass}">${log.message || ''}</span>`;
      body.appendChild(line);
      body.scrollTop = body.scrollHeight;
    }

    function clearLogs() {
      document.getElementById('terminal-body').innerHTML = '';
    }

    async function startSwarm() {
      const payload = {
        host: document.getElementById('host').value,
        port: document.getElementById('port').value,
        version: document.getElementById('version').value,
        baseUsername: document.getElementById('baseUsername').value,
        count: document.getElementById('count').value,
        delayBetweenBotsSeconds: document.getElementById('delay').value,
        messages: document.getElementById('messages').value.split('\n')
      };
      await fetch('/api/start', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
      });
    }

    async function stopSwarm() {
      await fetch('/api/stop', { method: 'POST' });
    }
  </script>
</body>
</html>
