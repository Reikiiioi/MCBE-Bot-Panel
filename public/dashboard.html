<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MineDDoS Dashboard</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;800&display=swap" rel="stylesheet">
</head>
<body>
  <canvas id="bg-canvas"></canvas>

  <div class="dashboard">
    <header class="topbar">
      <div class="logo">
        Mine<span style="font-weight: 800;">DDoS</span>
      </div>
      <nav class="topbar-nav">
        <button class="nav-btn active" onclick="showTab('overview')" id="tab-overview">Overview</button>
        <button class="nav-btn" onclick="showTab('control')" id="tab-control">Attack</button>
        <button class="nav-btn" onclick="showTab('manual')" id="tab-manual">Manual Control</button>
        <button class="nav-btn logout-btn" onclick="logout()" id="tab-logout">Logout</button>
      </nav>
    </header>

    <div class="main-layout">
      <main class="content">
        <div class="tab-content active" id="overview">
          <h1 class="page-title" id="title-overview">Overview</h1>
          
          <div class="stats-grid">
            <div class="stat-card glass-panel">
              <span class="stat-label" id="lbl-status">Status</span>
              <span class="stat-value status-badge" id="status-text">Stopped</span>
            </div>
            <div class="stat-card glass-panel"><span class="stat-label" id="lbl-total">Total Bots</span><span class="stat-value" id="total-bots">0</span></div>
            <div class="stat-card glass-panel"><span class="stat-label" id="lbl-online">Online</span><span class="stat-value text-success" id="online-bots">0</span></div>
            <div class="stat-card glass-panel"><span class="stat-label" id="lbl-kicked">Kicked</span><span class="stat-value text-danger" id="kicked-bots">0</span></div>
            <div class="stat-card glass-panel"><span class="stat-label" id="lbl-msgs">Messages</span><span class="stat-value" id="messages-sent">0</span></div>
            <div class="stat-card glass-panel"><span class="stat-label" id="lbl-errors">Errors</span><span class="stat-value text-white" id="errors-count">0</span></div>
            <div class="stat-card glass-panel"><span class="stat-label" id="lbl-uptime">Uptime</span><span class="stat-value" id="uptime">0s</span></div>
          </div>
          
          <div class="chart-container glass-panel">
            <canvas id="onlineChart"></canvas>
          </div>
          
          <footer class="footer">
            Created by <a href="https://github.com/Reikiiioi" target="_blank">Reikiiioi</a>
          </footer>
        </div>

        <div class="tab-content" id="control">
          <h1 class="page-title" id="title-attack">Attack Configuration</h1>
          <div class="control-group">
            <button class="btn btn-primary" onclick="startBots()" id="btn-start-attack">Start Attack</button>
            <button class="btn btn-danger" onclick="stopBots()" id="btn-stop-attack">Stop All</button>
          </div>
          
          <h2 class="section-title" id="title-params">Parameters</h2>
          <div class="form-grid glass-panel p-4">
            <div class="form-group"><label id="lbl-host">Host</label><input type="text" id="cfg-host" placeholder="localhost"></div>
            <div class="form-group"><label id="lbl-port">Port</label><input type="number" id="cfg-port" placeholder="19132"></div>
            <div class="form-group"><label id="lbl-version">Version</label>
              <select id="cfg-version">
                <!-- Versions populated by JS -->
              </select>
            </div>
            <div class="form-group"><label id="lbl-username">Username</label><input type="text" id="cfg-username" placeholder="Bot"></div>
            <div class="form-group"><label id="lbl-count">Count</label><input type="number" id="cfg-count" placeholder="10"></div>
            <div class="form-group"><label id="lbl-threads">Threads</label><input type="number" id="cfg-threads" placeholder="1"></div>
            <div class="form-group"><label id="lbl-delay">Start Delay (s)</label><input type="number" id="cfg-delay" placeholder="1" step="0.1"></div>
            <div class="form-group"><label id="lbl-final-delay">Final Delay (s)</label><input type="number" id="cfg-final-delay" placeholder="30"></div>
          </div>
          
          <h2 class="section-title" id="title-messages">Messages</h2>
          <div class="messages-editor glass-panel p-4">
            <div id="messages-list"></div>
            <div class="msg-controls">
              <input type="text" id="new-message" placeholder="New message">
              <button class="btn btn-primary" onclick="addMessage()">Add</button>
            </div>
          </div>
          
          <footer class="footer">
            Created by <a href="https://github.com/Reikiiioi" target="_blank">Reikiiioi</a>
          </footer>
        </div>

        <div class="tab-content" id="manual">
          <h1 class="page-title" id="title-manual">Manual Control</h1>
          
          <div class="control-group glass-panel p-4 mb-4">
            <div class="form-grid" style="flex: 1; margin-bottom: 24px;">
              <div class="form-group"><label id="lbl-man-user">Username</label><input type="text" id="manual-username" placeholder="Bot"></div>
              <div class="form-group"><label id="lbl-man-host">Host</label><input type="text" id="manual-host" placeholder="localhost"></div>
              <div class="form-group"><label id="lbl-man-port">Port</label><input type="number" id="manual-port" placeholder="19132"></div>
              <div class="form-group"><label id="lbl-man-version">Version</label>
                <select id="manual-version">
                  <!-- Versions populated by JS -->
                </select>
              </div>
            </div>
            <div style="display: flex; gap: 16px; align-items: center;">
              <button class="btn btn-primary" onclick="connectManualBot()" id="btn-connect">Connect</button>
              <button class="btn btn-danger" onclick="disconnectManualBot()" id="btn-disconnect">Disconnect</button>
              <div class="connection-status" style="margin-left: 20px;">
                <span class="status-dot disconnected" id="manual-status-dot"></span>
                <span id="manual-status-text" style="color: var(--text-muted);">Disconnected</span>
              </div>
            </div>
          </div>
          
          <div class="chat-layout">
            <div class="chat-panel">
              <div class="chat-header" id="title-server-chat">Server Chat</div>
              <div class="chat-messages" id="server-chat"></div>
            </div>
            <div class="chat-panel">
              <div class="chat-header" id="title-commands">Commands</div>
              <div class="chat-messages" id="command-chat"></div>
              <div class="chat-input-area">
                <input type="text" id="command-input" placeholder="Message..." onkeypress="if(event.key==='Enter') sendCommand()">
                <button class="btn btn-primary" onclick="sendCommand()" id="btn-send">Send</button>
              </div>
            </div>
          </div>
          
          <footer class="footer">
            Created by <a href="https://github.com/Reikiiioi" target="_blank">Reikiiioi</a>
          </footer>
        </div>
      </main>

      <!-- Logs Overlay -->
      <aside class="logs-overlay" id="logs-panel">
        <div class="logs-header">
          <span class="logs-title" id="title-logs">System Logs</span>
          <button class="close-logs" onclick="toggleLogs()">×</button>
        </div>
        <div class="log-container" id="log-container"></div>
        <div style="padding: 16px; border-top: 1px solid var(--border-color);">
          <button class="btn btn-secondary" onclick="clearLogs()" id="btn-clear" style="width: 100%;">Clear Logs</button>
        </div>
      </aside>
    </div>
  </div>

  <div class="floating-logs-btn" onclick="toggleLogs()" title="Toggle Logs">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"></line><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="18" x2="20" y2="18"></line></svg>
  </div>

  <script src="/app.js"></script>
</body>
</html>
